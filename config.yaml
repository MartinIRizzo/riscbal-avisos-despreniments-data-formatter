# Settings of a formatter run (read by data_formatter/config.py).
#
# Everything that changes how the dataset is built lives here. The optional
# steps (negative_shift, temporal_controls, fallback) are switched on and off
# with the `enabled` field of their own section. Each run records these
# values, and a copy of this file, in runs/<run_id>/, so an export can always
# be traced back to the settings that made it.
# Run with another file: python -m data_formatter.main --config other.yaml

# Paths, relative to the repo root (where the formatter is run from). Every
# run writes all its outputs (final_gdf.csv and the intermediate files) to
# <runs>/<run_id>/outputs/; nothing is written anywhere else.
paths:
  data: data
  runs: runs

gauges:
  # Read from the RiscBal database (10-minute records), not the AEMET file.
  riscbal_stations: [BAR04, GRO08]
  # AEMET's pluviometric day runs 07:00 UTC on day D to 07:00 UTC on D+1 and
  # is labelled D. RiscBal windows are shifted by the same hours.
  pluviometric_day_offset_hours: 7
  # Esporles samples dated in (after, until] use a RiscBal gauge instead of
  # their AEMET station: the gauges' record periods (AEMET data ends in 2022).
  reassignments:
    - {municipality: Esporles, after: "2024-03-25", until: "2025-03-25", gauge: GRO08}
    - {municipality: Esporles, after: "2026-01-20", until: "2026-01-21", gauge: BAR04}

# Original negative sampling: move `share` of the random points to a random
# day with rain >= the station's `percentile`, within `period`.
negative_shift:
  # Phase B0 (2026-10-17): OFF. Moving negatives to high-rainfall days made
  # every model learn "more rain -> less risk" (vault: D-008).
  enabled: false
  share: 0.4
  percentile: 0.95
  period: ["2005-01-01", "2015-12-31"]
  seed: 42

# Temporal controls (see data_formatter/controls.py for the rules). Only
# rockfalls at AEMET gauges get controls; the RiscBal gauges get none for now
# (duplicated 10-minute records).
temporal_controls:
  # Phase B1: non-rockfall days at each rockfall's site (vault: D-009).
  enabled: true
  per_rockfall: 10
  # No control within this many days of any rockfall at the same gauge.
  exclusion_days: 7
  # Share of the 90 antecedent days that must be measured.
  min_coverage: 0.9
  # The rockfalls' period.
  period: ["2005-01-01", "2015-12-31"]
  seed: 42

# Replacement gauge (see data_formatter/gauge_fallback.py): if a sample's
# own gauge didn't measure its window, a twin of it or the nearest
# stations.csv gauge that did, if their daily rain agrees; otherwise the
# sample is excluded (and reported in exclusions.csv). Days of -4 runs are
# not measured (vault: D-015). Distance is straight-line for now (stand-in
# for the slope-weighted one).
fallback:
  # Under-measured samples read rain from another gauge or are excluded
  # (vault: D-012, D-021). Off: every sample keeps its own gauge.
  enabled: true
  # Same threshold as the temporal controls (real readings only).
  min_coverage: 0.9
  require_event_day: true
  # Rain in the Tramuntana changes over a few km: no gauge further away.
  max_distance_km: 5.0
  # A twin (same code +/- a suffix, e.g. B158 / B158X) must be this close
  # to the own gauge, unless r > min_r (vault: D-021).
  twin_max_distance_km: 1.0
  # Pearson r of the daily rain of the two gauges, on their common real
  # readings in correlation_period: at least min_common_days of them
  # (95% interval of r ~0.88-0.92 around 0.90 with 365 days).
  min_r: 0.9
  min_common_days: 365
  correlation_period: ["2005-01-01", "2015-12-31"]
